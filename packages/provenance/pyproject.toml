[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "provenance-substrate"
version = "0.1.0"
description = "The model proposes, deterministic code disposes, a human signs. Content-addressed envelopes, hash-chained audit, signed approval — for ledgers, Lean proofs, paper claims, reproductions, benchmarks, and peer review."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Isaac Hernandez", email = "kernel.chat@gmail.com" }]
keywords = ["provenance", "reproducibility", "audit", "lean", "mathlib", "conformance", "ai-safety", "peer-review", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
provsub = "provsubstrate.cli:main"

[project.urls]
Homepage = "https://github.com/isaacsight/kernel/tree/main/packages/provenance"
Source = "https://github.com/isaacsight/kernel"
Issues = "https://github.com/isaacsight/kernel/issues"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/provsubstrate"]

[tool.hatch.build.targets.sdist]
include = ["src/provsubstrate", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
